function renderHome(items,append=false){if(!append)homeResults.innerHTML="";const valid=(items||[]).filter(x=>x.id?.videoId);homeResults.insertAdjacentHTML("beforeend",valid.map(videoCardHTML).join(""))}

async function searchHome(query,append=false){query=String(query||"").trim();if(!query||homeLoading)return;if(Date.now()<quotaBlockedUntil){showQuotaMessage();return}if(!append){homeNextPageToken="";homeResults.innerHTML='<div class="loader">Searching...</div>'}homeLoading=true;homeLoader.textContent="Loading...";try{const data=await youtubeSearch(query,10,append?homeNextPageToken:"");if(!append)homeResults.innerHTML="";renderHome(data.items||[],true);homeCurrentQuery=query;homeNextPageToken=data.nextPageToken||"";if(!append)saveHistory(query)}catch(e){if(isQuotaError(e)){showQuotaMessage()}else if(e.message==="LOCAL_QUOTA_WAIT"){showQuotaMessage()}else if(!append){homeResults.innerHTML=`<div class="error">${escapeHTML(e.message)}</div>`}}finally{homeLoading=false;if(Date.now()<quotaBlockedUntil)homeLoader.textContent="";else homeLoader.textContent=homeNextPageToken?"Scroll for more...":""}}

function getMoodKeyword(title){const t=String(title||"").toLowerCase();if(/sad|kosto|কষ্ট|দুঃখ|broken|alone|pain|বিরহ/.test(t))return"sad emotional";if(/love|romantic|romance|ভালোবাসা|প্রেম/.test(t))return"romantic love";if(/lofi|chill|relax|লোফাই/.test(t))return"lofi chill";if(/party|dance|dj|remix/.test(t))return"party dance remix";if(/happy|fun|হ্যাপি/.test(t))return"happy upbeat";if(/islamic|nasheed|হামদ|নাত|devotional/.test(t))return"islamic nasheed";return normalizeSongTitle(title)+" similar music"}
function relatedCacheKey(){return RELATED_CACHE_PREFIX+currentVideoId}
async function loadRelatedVideos(){if(!currentVideoId)return;const key=relatedCacheKey();try{const cached=sessionStorage.getItem(key);if(cached){currentRelatedItems=shuffle(JSON.parse(cached));renderRelated(currentRelatedItems);return}}catch(e){}relatedResults.innerHTML='<div class="loader">Related music loading...</div>';landscapeResults.innerHTML="";try{const mood=getMoodKeyword(currentVideoTitle),variations=["new","latest","mix","hits","playlist"],variation=variations[Math.floor(Math.random()*variations.length)],query=mood+" music "+variation,data=await youtubeSearch(query,10);let items=(data.items||[]).filter(x=>x.id?.videoId&&x.id.videoId!==currentVideoId&&!isSameSong(x.snippet?.title||""));items=shuffle(items).slice(0,10);currentRelatedItems=items;try{sessionStorage.setItem(key,JSON.stringify(items))}catch(e){}renderRelated(items)}catch(e){if(isQuotaError(e)){showQuotaMessage()}else relatedResults.innerHTML=`<div class="error">Related music পাওয়া যায়নি।<br><br>${escapeHTML(e.message)}</div>`}}
function renderRelated(items){relatedResults.innerHTML=(items||[]).map(videoCardHTML).join("");renderLandscapeRelated(items)}
function renderLandscapeRelated(items){landscapeResults.innerHTML=(items||[]).map(item=>{const id=item.id?.videoId;if(!id)return "";const title=escapeHTML(item.snippet?.title||"Untitled"),thumb=item.snippet?.thumbnails?.medium?.url||item.snippet?.thumbnails?.default?.url||"";return `<div class="landscape-card" data-video-id="${escapeHTML(id)}" data-title="${title}" data-thumb="${escapeHTML(thumb)}"><img src="${escapeHTML(thumb)}" alt=""><div>${title}</div></div>`}).join("")}

function openPlayer(id,title,thumb){if(!id)return;const fs=!!(document.fullscreenElement||document.webkitFullscreenElement);currentVideoId=id;currentVideoTitle=title||"JAWRA MUSIC";currentVideoThumb=thumb||"";playbackActive=true;if(youtubeFrame.dataset.videoId!==id){youtubeFrame.src="https://www.youtube-nocookie.com/embed/"+encodeURIComponent(id)+"?autoplay=1&playsinline=1&rel=0&modestbranding=1&enablejsapi=1&origin="+encodeURIComponent(location.origin);youtubeFrame.dataset.videoId=id}playerPage.classList.remove("mini-hidden");playerPage.style.display="block";app.style.display="none";miniPlayer.style.display="none";isMiniMode=false;playerSearchPanel.style.display="none";requestWakeLock();if(!fs)window.scrollTo({top:0,behavior:"instant"});loadRelatedVideos()}
function enterMiniMode(){if(!currentVideoId)return;exitVideoFullscreen();playbackActive=true;isMiniMode=true;playerPage.classList.add("mini-hidden");app.style.display="block";miniPlayer.style.display="flex";miniTitle.textContent=currentVideoTitle;miniThumb.src=currentVideoThumb||"";requestWakeLock()}
function reopenMiniPlayer(){if(!currentVideoId)return;playerPage.classList.remove("mini-hidden");playerPage.style.display="block";app.style.display="none";miniPlayer.style.display="none";isMiniMode=false;requestWakeLock()}
function closePlayback(){exitVideoFullscreen();playbackActive=false;isMiniMode=false;youtubeFrame.src="";youtubeFrame.dataset.videoId="";currentVideoId=currentVideoTitle=currentVideoThumb="";currentRelatedItems=[];playerPage.classList.remove("mini-hidden");playerPage.style.display="none";miniPlayer.style.display="none";app.style.display="block";releaseWakeLock()}
function openPlayerSearch(){if(currentVideoId)enterMiniMode();openSearchScreen()}
async function searchFromPlayer(){const q=playerSearchInput.value.trim();if(!q)return;if(currentVideoId)enterMiniMode();playerSearchPanel.style.display="none";openSearchScreen(q);await performSearch(q)}
function openSearchScreen(prefill=""){searchScreen.style.display="block";searchScreen.setAttribute("aria-hidden","false");searchScreenInput.value=prefill;renderHistory();setTimeout(()=>searchScreenInput.focus(),100)}
function closeSearchScreen(){searchScreen.style.display="none";searchScreen.setAttribute("aria-hidden","true")}
function renderHistory(){const history=readHistory();if(!history.length){recentSearches.innerHTML='<div class="recent-empty">তোমার সার্চ করা গান ও শব্দ এখানে দেখা যাবে।<br>সার্চ বক্সে লিখে 🔍 চাপো অথবা 🎙️ দিয়ে বলো।</div>';return}recentSearches.innerHTML=history.map(h=>`<div class="recent-row" data-query="${escapeHTML(h.query)}"><span class="recent-clock">◴</span><div class="recent-query">${escapeHTML(h.query)}</div><button class="recent-fill" aria-label="Use search">↖</button></div>`).join("")}
async function performSearch(query){query=String(query||"").trim();if(!query)return;searchScreenInput.value=query;closeSearchScreen();homeSearchInput.value=query;homeCurrentQuery=query;app.style.display="block";playerPage.style.display="none";miniPlayer.style.display=currentVideoId?"flex":"none";await searchHome(query,false);navHome.classList.add("active");navSearch.classList.remove("active");navPlayer.classList.remove("active")}
function startVoiceSearch(button,input){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert("তোমার browser-এ Voice Search support নেই। Chrome দিয়ে চেষ্টা করো।");return}if(recognition){try{recognition.stop()}catch(e){}recognition=null;button.classList.remove("listening");return}recognition=new SR();recognition.lang="bn-BD";recognition.interimResults=false;recognition.continuous=false;recognition.maxAlternatives=1;recognition.onstart=()=>button.classList.add("listening");recognition.onresult=async ev=>{const q=ev.results?.[0]?.[0]?.transcript||"";if(q){input.value=q;await performSearch(q)}};recognition.onerror=()=>{};recognition.onend=()=>{button.classList.remove("listening");recognition=null};try{recognition.start()}catch(e){}}

async function enterVideoFullscreen(){try{if(document.fullscreenElement||document.webkitFullscreenElement)return;if(fullFrameHost.requestFullscreen){try{await fullFrameHost.requestFullscreen({navigationUI:"hide"})}catch(e){await fullFrameHost.requestFullscreen()}}else if(fullFrameHost.webkitRequestFullscreen){fullFrameHost.webkitRequestFullscreen()}if(screen.orientation?.lock){try{await screen.orientation.lock("landscape")}catch(e){}}playerRotateBtn.textContent="↙"}catch(e){console.log("Fullscreen error",e)}}
async function exitVideoFullscreen(){try{if(document.fullscreenElement&&document.exitFullscreen)await document.exitFullscreen();else if(document.webkitFullscreenElement)document.webkitExitFullscreen()}catch(e){}try{screen.orientation?.unlock?.()}catch(e){}playerRotateBtn.textContent="⛶"}
async function requestWakeLock(){if(!("wakeLock"in navigator))return;try{if(wakeLock)return;wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>wakeLock=null)}catch(e){}}
async function releaseWakeLock(){if(!wakeLock)return;try{await wakeLock.release()}catch(e){}wakeLock=null}

document.addEventListener("click",ev=>{const card=ev.target.closest(".video-card,.landscape-card");if(card){openPlayer(card.dataset.videoId,card.dataset.title,card.dataset.thumb);return}const recent=ev.target.closest(".recent-row");if(recent){performSearch(recent.dataset.query);return}});
homeSearchInput.addEventListener("click",()=>{if(currentVideoId&&!isMiniMode)enterMiniMode();openSearchScreen()});
homeSearchBtn.addEventListener("click",()=>{if(currentVideoId&&!isMiniMode)enterMiniMode();openSearchScreen(homeSearchInput.value)});
homeVoiceBtn.addEventListener("click",()=>{if(currentVideoId&&!isMiniMode)enterMiniMode();openSearchScreen();startVoiceSearch(searchVoiceBtn,searchScreenInput)});
searchVoiceBtn.addEventListener("click",()=>startVoiceSearch(searchVoiceBtn,searchScreenInput));
$("searchScreenGo").addEventListener("click",()=>performSearch(searchScreenInput.value));
searchScreenInput.addEventListener("keydown",e=>{if(e.key==="Enter")performSearch(searchScreenInput.value)});
$("searchBack").addEventListener("click",closeSearchScreen);
document.querySelectorAll(".category").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".category").forEach(x=>x.classList.remove("active"));b.classList.add("active");const q=b.dataset.query;homeSearchInput.value=q;searchHome(q,false)}));
homeDemon.addEventListener("click",()=>currentVideoId?enterMiniMode():openSearchScreen());
playerDemonBtn.addEventListener("click",()=>currentVideoId&&enterMiniMode());
playerSearchBtn.addEventListener("click",openPlayerSearch);
playerSearchGo.addEventListener("click",searchFromPlayer);
playerSearchInput.addEventListener("keydown",e=>{if(e.key==="Enter")searchFromPlayer()});
playerRotateBtn.addEventListener("click",()=>document.fullscreenElement||document.webkitFullscreenElement?exitVideoFullscreen():enterVideoFullscreen());
playerBack.addEventListener("click",()=>{if(document.fullscreenElement||document.webkitFullscreenElement){exitVideoFullscreen();return}if(isMiniMode){reopenMiniPlayer();return}closePlayback()});
miniOpen.addEventListener("click",reopenMiniPlayer);
miniClose.addEventListener("click",closePlayback);
relatedClear.addEventListener("click",async()=>{if(!currentVideoId)return;try{sessionStorage.removeItem(relatedCacheKey())}catch(e){}await loadRelatedVideos()});
navHome.addEventListener("click",()=>{if(document.fullscreenElement||document.webkitFullscreenElement)exitVideoFullscreen();closeSearchScreen();playerPage.style.display="none";app.style.display="block";playerPage.classList.remove("mini-hidden");navHome.classList.add("active");navSearch.classList.remove("active");navPlayer.classList.remove("active")});
navSearch.addEventListener("click",()=>{if(currentVideoId&&!isMiniMode)enterMiniMode();openSearchScreen();navHome.classList.remove("active");navSearch.classList.add("active");navPlayer.classList.remove("active")});
navPlayer.addEventListener("click",()=>{closeSearchScreen();if(currentVideoId)reopenMiniPlayer();navHome.classList.remove("active");navSearch.classList.remove("active");navPlayer.classList.add("active")});
window.addEventListener("scroll",()=>{if(homeLoading||!homeNextPageToken||searchScreen.style.display==="block")return;if(window.innerHeight+window.scrollY>=document.body.offsetHeight-900)searchHome(homeCurrentQuery,true)},{passive:true});
document.addEventListener("fullscreenchange",()=>playerRotateBtn.textContent=document.fullscreenElement===fullFrameHost?"↙":"⛶");
document.addEventListener("webkitfullscreenchange",()=>playerRotateBtn.textContent=document.webkitFullscreenElement===fullFrameHost?"↙":"⛶");
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&playbackActive)requestWakeLock()});
let lastTouchEnd=0;
document.addEventListener("touchend",e=>{const now=Date.now();if(now-lastTouchEnd<=300)e.preventDefault();lastTouchEnd=now},{passive:false});
document.addEventListener("touchmove",e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
setTimeout(()=>splash.style.display="none",3000);
if(hasApiKey())searchHome("trending music",false);else{homeResults.innerHTML='<div class="error">YouTube API key বসাও।<br><br>তারপর JAWRA MUSIC চালু করো।</div>';homeLoader.textContent=""}
</script><script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){
        navigator.serviceWorker.register("./sw.js");
    });
}
</script>
